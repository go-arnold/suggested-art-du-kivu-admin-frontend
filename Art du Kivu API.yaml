components:
  schemas:
    ArticleDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 300
        slug:
          type: string
          maxLength: 320
          pattern: ^[-a-zA-Z0-9_]+$
        excerpt:
          type: string
        content:
          type: string
        featured_image_url:
          type: string
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          readOnly: true
        author:
          allOf:
          - $ref: '#/components/schemas/AuthorBrief'
          readOnly: true
        article_type:
          $ref: '#/components/schemas/ArticleTypeEnum'
        read_time:
          type: integer
          maximum: 32767
          minimum: 0
        view_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        like_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_featured:
          type: boolean
        status:
          $ref: '#/components/schemas/Status68aEnum'
        published_at:
          type: string
          format: date-time
          nullable: true
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
          readOnly: true
      required:
      - author
      - category
      - comments
      - content
      - featured_image_url
      - id
      - slug
      - tags
      - title
    ArticleList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 300
        slug:
          type: string
          maxLength: 320
          pattern: ^[-a-zA-Z0-9_]+$
        excerpt:
          type: string
        featured_image_url:
          type: string
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        author_name:
          type: string
          readOnly: true
        read_time:
          type: integer
          maximum: 32767
          minimum: 0
        view_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        like_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_featured:
          type: boolean
        published_at:
          type: string
          format: date-time
          nullable: true
      required:
      - author_name
      - category
      - featured_image_url
      - id
      - slug
      - title
    ArticleListRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        slug:
          type: string
          minLength: 1
          maxLength: 320
          pattern: ^[-a-zA-Z0-9_]+$
        excerpt:
          type: string
        read_time:
          type: integer
          maximum: 32767
          minimum: 0
        view_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        like_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_featured:
          type: boolean
        published_at:
          type: string
          format: date-time
          nullable: true
      required:
      - slug
      - title
    ArticleTypeEnum:
      enum:
      - blog
      - magazine
      type: string
      description: |-
        * `blog` - Blog
        * `magazine` - Magazine
    ArticleWrite:
      type: object
      properties:
        title:
          type: string
          maxLength: 300
        slug:
          type: string
          maxLength: 320
          pattern: ^[-a-zA-Z0-9_]+$
        excerpt:
          type: string
        content:
          type: string
        featured_image:
          type: string
          nullable: true
        category:
          type: integer
          nullable: true
        tags:
          type: array
          items:
            type: integer
        article_type:
          $ref: '#/components/schemas/ArticleTypeEnum'
        status:
          $ref: '#/components/schemas/Status68aEnum'
        is_featured:
          type: boolean
        read_time:
          type: integer
          maximum: 32767
          minimum: 0
        scheduled_at:
          type: string
          format: date-time
          nullable: true
      required:
      - content
      - title
