        title:
          type: string
          minLength: 1
          maxLength: 300
        slug:
          type: string
          minLength: 1
          maxLength: 320
          pattern: ^[-a-zA-Z0-9_]+$
        excerpt:
          type: string
        content:
          type: string
          minLength: 1
        featured_image:
          type: string
          minLength: 1
          nullable: true
